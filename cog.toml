ignore_merge_commits = true
branch_whitelist = ["master", "main"]
skip_ci = "[skip ci]"

generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
monorepo_version_separator = "-"

pre_bump_hooks = ["uv lock --no-upgrade"]

post_bump_hooks = [
    "git push",
    "git push --tags",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "shawndeng-homelab"
repository = "trade-system"
package_template = "remote"

# ── 子包(monorepo packages)配置 ──
# 每个 [packages.<包名>] 声明一个受 cocogitto 跟踪的子包。
# cocogitto 按 path 把每条提交归属到对应子包，据此分别计算版本号并打 tag；
# 未在此注册的目录下的提交会被忽略(不会触发任何 bump)。
[packages.options-strategies]
path = "packages/options-strategies"
public_api = true
changelog_path = "packages/options-strategies/CHANGELOG.md"
pre_bump_hooks = [
    "uv version --package options-strategies {{version}}",
]

[packages.backtest-charts]
path = "packages/backtest-charts"
public_api = true
changelog_path = "packages/backtest-charts/CHANGELOG.md"
pre_bump_hooks = [
    "uv version --package backtest-charts {{version}}",
]
