[project]
name = "backtest-charts"
version = "0.1.2"
description = "Altair visualizations for optopsy backtest results (equity curve, P&L, exit analysis)"
readme = "README.md"
authors = [
    { name = "ShawnDeng-code", email = "shawndeng1109@qq.com" }
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "altair[all]>=5.5.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
