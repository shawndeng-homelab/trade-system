[project]
name = "backtest-charts"
version = "0.2.0"
description = "Plotly visualizations for optopsy backtest results (equity curve, P&L, exit analysis, summary)"
readme = "README.md"
authors = [
    { name = "ShawnDeng-code", email = "shawndeng1109@qq.com" }
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "plotly>=5.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
