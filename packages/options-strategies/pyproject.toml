[project]
name = "options-strategies"
version = "0.3.0"
description = "Options backtesting strategies (PMCC) powered by optopsy"
readme = "README.md"
authors = [
    { name = "ShawnDeng-code", email = "shawndeng1109@qq.com" }
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "QuantLib>=1.40,<2",
    "click>=8.1,<9",
    "numpy>=2.0",
    "optopsy[data]>=2.3.0",
    "pandas>=2.0",
    "pyarrow>=18",
    "pydantic>=2.0",
    "psycopg2>=2.9.12",
    "rich-click>=1.8,<2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
simulate-market = "options_strategies.simulation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
